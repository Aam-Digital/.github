# Lints the calling repository's GitHub Actions workflows with actionlint
# (including shellcheck on `run:` scripts).
name: actionlint

on:
  workflow_call:

jobs:
  # The job id is part of the check name (`<caller job> / actionlint`). Do not rename it within v1.
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
