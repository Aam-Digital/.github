# Builds a container image and (by default) pushes it, for PR, prerelease and release builds alike.
# Callers only pass inputs; see README.md in this folder for examples and the resulting check names.
#
# Tags are always explicit (docker/metadata-action's automatic `latest` is turned off):
# - `version`      -> tag `<version>` (+ the `org.opencontainers.image.version` label)
# - `stable: true` -> tags `stable` and `latest` (derive it from `!github.event.release.prerelease`,
#                     never by parsing the version string)
# - `tags`         -> any extra tags, e.g. `edge`, `master` or `pr-123`
# A PR image must carry nothing but its `pr-<n>` tag, otherwise pr-image-cleanup.yml leaves it in place.
#
# Two modes:
# - default: one job `build` builds all platforms (QEMU for non-amd64 platforms);
# - `native-runners: true`: one job `build-native (<platform>)` per platform on a native runner pushes by digest,
#   then the job `merge` creates the multi-platform image with all tags.
#
# An image whose last tag moves to a new push (e.g. the previous image of a PR) stays in the package untagged.
# pr-image-cleanup.yml deletes such untagged images (older than 2 days) when a PR is closed.
#
# Steps that are identical in several jobs are written once and reused with YAML anchors (`&name` / `*name`).
name: Docker image

on:
  workflow_call:
    inputs:
      images:
        type: string
        required: true
        description: Image name(s) without tag, one per line (or comma-separated), e.g. `ghcr.io/aam-digital/replication-backend`. All of them get the same tags.
      context:
        type: string
        required: false
        default: .
        description: Docker build context
      file:
        type: string
        required: false
        default: ""
        description: Path to the Dockerfile (default `<context>/Dockerfile`)
      version:
        type: string
        required: false
        default: ""
        description: Version to tag the image with; also set as the `org.opencontainers.image.version` label. Leave empty for PR builds.
      stable:
        type: boolean
        required: false
        default: false
        description: Also tag the image `stable` and `latest` (full releases only; requires `version`)
      tags:
        type: string
        required: false
        default: ""
        description: Extra tags, one per line (or comma-separated), e.g. `edge` or `pr-123`
      labels:
        type: string
        required: false
        default: ""
        description: Extra/overriding OCI labels (`key=value`, one per line), e.g. a custom `org.opencontainers.image.description`
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
        description: >-
          Target platforms. PR builds pass `linux/amd64`. QEMU is only set up if a non-amd64 platform is requested.
          With `native-runners`, only `linux/amd64` and `linux/arm64` are supported.
      native-runners:
        type: boolean
        required: false
        default: false
        description: >-
          Build each platform on a native runner (`linux/amd64` on `ubuntu-latest`, `linux/arm64` on
          `ubuntu-24.04-arm`) instead of emulating with QEMU, then merge them into one multi-platform image.
          Check names change to `<caller job> / build-native (<platform>)` and `<caller job> / merge`.
      build-args:
        type: string
        required: false
        default: ""
        description: Build arguments (`KEY=value`, one per line)
      push:
        type: boolean
        required: false
        default: true
        description: Push the image. Set to false (e.g. for PRs from forks) to only check that it builds.
      cache-scope:
        type: string
        required: false
        default: ""
        description: >-
          GitHub Actions cache scope. Defaults to the last path segment of the first image, so that the images of a
          multi-image repository do not overwrite each other's cache. Must differ between calls in the same workflow run
          with `native-runners` (it also names the digest artifacts).
      artifact-name:
        type: string
        required: false
        default: ""
        description: Name of a workflow artifact (e.g. built web app files from an earlier job) to download before building
      artifact-path:
        type: string
        required: false
        default: .
        description: Where to download `artifact-name` to
      prepare:
        type: string
        required: false
        default: ""
        description: >-
          Shell commands run in the checked-out repository before building, e.g. to inject the version
          into package.json. `$VERSION` holds the `version` input.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
        description: Docker Hub username; only needed if one of the images is pushed to Docker Hub
      DOCKERHUB_TOKEN:
        required: false
        description: Docker Hub access token (or password) for DOCKERHUB_USERNAME
      BUILD_SECRETS:
        required: false
        description: >-
          Secrets for the build as BuildKit secrets (`id=value`, one per line; the format of build-push-action's
          `secrets` input), e.g. `sentry_auth_token=<token>`. Read in the Dockerfile with
          `RUN --mount=type=secret,id=sentry_auth_token ...`. Masked in the logs; unset or empty passes no secret.
    outputs:
      digest:
        description: Digest of the built image (the multi-platform index if more than one platform was built)
        value: ${{ jobs.build.outputs.digest || jobs.merge.outputs.digest }}
      tags:
        description: All image references that were tagged (`<image>:<tag>`, one per line)
        value: ${{ jobs.build.outputs.tags || jobs.merge.outputs.tags }}

jobs:
  # The job id is part of the check name (`<caller job> / build`). Do not rename it within v1.
  build:
    if: ${{ !inputs.native-runners }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - &mask-build-secrets
        name: Mask build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: |
          # Every value is masked in the logs, also if the caller composed BUILD_SECRETS (`format(...)`) from
          # a secret and GitHub does not know the composed value as a secret. Nothing is printed.
          while IFS= read -r line; do
            value="${line#*=}"
            [ -z "$value" ] || echo "::add-mask::$value"
          done <<< "$BUILD_SECRETS"

      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - &download-artifact
        name: Download artifact ${{ inputs.artifact-name }}
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - &prepare
        name: Prepare build
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
          VERSION: ${{ inputs.version }}
        run: eval "$PREPARE"

      - &config
        name: Compute tags and settings
        id: config
        env:
          IMAGES: ${{ inputs.images }}
          VERSION: ${{ inputs.version }}
          STABLE: ${{ inputs.stable }}
          EXTRA_TAGS: ${{ inputs.tags }}
          LABELS: ${{ inputs.labels }}
          PLATFORMS: ${{ inputs.platforms }}
          NATIVE_RUNNERS: ${{ inputs.native-runners }}
          CACHE_SCOPE: ${{ inputs.cache-scope }}
        run: |
          # Splits a list separated by newlines, commas or spaces into words.
          words() { printf '%s\n' "$1" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed '/^$/d'; }

          mapfile -t images < <(words "$IMAGES")
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No image name given (input 'images')"
            exit 1
          fi

          tags=()
          [ -z "$VERSION" ] || tags+=("$VERSION")
          mapfile -t -O "${#tags[@]}" tags < <(words "$EXTRA_TAGS")
          if [ "$STABLE" = "true" ]; then
            if [ -z "$VERSION" ]; then
              echo "::error::'stable: true' requires a 'version'"
              exit 1
            fi
            tags+=(stable latest)
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::No tag to apply: set 'version' and/or 'tags'"
            exit 1
          fi
          for tag in "${tags[@]}"; do
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid image tag '$tag'"
              exit 1
            fi
          done

          labels="$LABELS"
          if [ -n "$VERSION" ] && ! grep -q '^[[:space:]]*org\.opencontainers\.image\.version=' <<< "$LABELS"; then
            labels="org.opencontainers.image.version=$VERSION"$'\n'"$LABELS"
          fi

          needs_qemu=false
          while IFS= read -r platform; do
            [ "$platform" = "linux/amd64" ] || needs_qemu=true
            if [ "$NATIVE_RUNNERS" = "true" ] && [ "$platform" != "linux/amd64" ] && [ "$platform" != "linux/arm64" ]; then
              echo "::error::'native-runners' supports only the platforms linux/amd64 and linux/arm64, not '$platform'"
              exit 1
            fi
          done < <(words "$PLATFORMS")
          [ "$NATIVE_RUNNERS" != "true" ] || needs_qemu=false

          needs_ghcr_login=false
          needs_dockerhub_login=false
          for image in "${images[@]}"; do
            host="${image%%/*}"
            case "$host" in
              ghcr.io) needs_ghcr_login=true ;;
              docker.io | index.docker.io) needs_dockerhub_login=true ;;
              *.* | *:* | localhost) ;; # another registry: not supported for login
              *) needs_dockerhub_login=true ;; # no registry host means Docker Hub
            esac
          done

          scope="$CACHE_SCOPE"
          if [ -z "$scope" ]; then
            scope="${images[0]##*/}"
          fi

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "images<<$delimiter"
            printf '%s\n' "${images[@]}"
            echo "$delimiter"
            echo "image-names=$(IFS=,; echo "${images[*]}")"
            echo "tags<<$delimiter"
            printf 'type=raw,value=%s\n' "${tags[@]}"
            echo "$delimiter"
            echo "tag-list<<$delimiter"
            printf '%s\n' "${tags[@]}"
            echo "$delimiter"
            echo "labels<<$delimiter"
            printf '%s\n' "$labels"
            echo "$delimiter"
            echo "needs-qemu=$needs_qemu"
            echo "needs-ghcr-login=$needs_ghcr_login"
            echo "needs-dockerhub-login=$needs_dockerhub_login"
            echo "cache-scope=$scope"
          } >> "$GITHUB_OUTPUT"

          echo "Images: ${images[*]}"
          echo "Tags: ${tags[*]}"
          echo "Platforms: $PLATFORMS (native runners: $NATIVE_RUNNERS, QEMU: $needs_qemu)"
          echo "Cache scope: $scope"

      - &meta
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.config.outputs.images }}
          tags: ${{ steps.config.outputs.tags }}
          labels: ${{ steps.config.outputs.labels }}
          flavor: |
            latest=false

      - name: Set up QEMU
        if: steps.config.outputs.needs-qemu == 'true'
        uses: docker/setup-qemu-action@v4

      - &setup-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - &login-ghcr
        name: Login to GitHub Container Registry
        if: inputs.push && steps.config.outputs.needs-ghcr-login == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - &login-dockerhub
        name: Login to Docker Hub
        if: inputs.push && steps.config.outputs.needs-dockerhub-login == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}
          cache-to: type=gha,mode=min,scope=${{ steps.config.outputs.cache-scope }},ignore-error=true

  # Native-runner mode, part 1: one job per platform (check name `<caller job> / build-native (<platform>)`), each
  # pushes its image by digest only. Do not rename within v1.
  build-native:
    if: inputs.native-runners
    # No `name` with a matrix expression: GitHub appends the matrix value itself (`build-native (linux/amd64)`),
    # while the jobs skipped without native-runners would show the unexpanded expression.
    name: build-native
    strategy:
      fail-fast: false
      matrix:
        # Expressions cannot split strings, so the two supported platforms are picked by `contains`.
        # Any other platform is rejected by the step "Compute tags and settings".
        platform: ${{ fromJSON(contains(inputs.platforms, 'linux/arm64') && (contains(inputs.platforms, 'linux/amd64') && '["linux/amd64","linux/arm64"]' || '["linux/arm64"]') || '["linux/amd64"]') }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - *mask-build-secrets
      - *checkout
      - *download-artifact
      - *prepare
      - *config
      - *meta
      - *setup-buildx
      - *login-ghcr
      - *login-dockerhub

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          outputs: ${{ inputs.push && format('type=image,"name={0}",push-by-digest=true,name-canonical=true,push=true', steps.config.outputs.image-names) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          cache-to: type=gha,mode=min,scope=${{ steps.config.outputs.cache-scope }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }},ignore-error=true

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest '$DIGEST'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-digests-${{ steps.config.outputs.cache-scope }}--${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Native-runner mode, part 2: creates the multi-platform image with all tags (check name `<caller job> / merge`).
  # Do not rename within v1.
  merge:
    if: inputs.native-runners && inputs.push
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - *config
      - *meta

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-image-digests-${{ steps.config.outputs.cache-scope }}--*
          merge-multiple: true

      - *setup-buildx
      - *login-ghcr
      - *login-dockerhub

      - name: Create multi-platform image
        id: build
        env:
          IMAGES: ${{ steps.config.outputs.images }}
          TAG_LIST: ${{ steps.config.outputs.tag-list }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          mapfile -t digests < <(find "$DIGEST_DIR" -maxdepth 1 -type f -printf 'sha256:%f\n' | sort)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "::error::No per-platform image digests found"
            exit 1
          fi
          mapfile -t tags <<< "$TAG_LIST"
          first=""
          while IFS= read -r image; do
            args=()
            for tag in "${tags[@]}"; do
              [ -z "$tag" ] || args+=(--tag "$image:$tag")
            done
            for digest in "${digests[@]}"; do
              args+=("$image@$digest")
            done
            docker buildx imagetools create "${args[@]}"
            [ -n "$first" ] || first="$image:${tags[0]}"
          done <<< "$IMAGES"
          docker buildx imagetools inspect "$first"
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine the digest of $first"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

